# Inside the gateway's existing server block, with the terminal_login limit zone.
location = /kindle-terminal { return 308 /kindle-terminal/; }
location = /kindle-terminal/api/tokens {
  limit_req zone=terminal_login burst=3 nodelay;
  limit_req_status 429;
  set $kindle_terminal_upstream http://guacamole-kindle-terminal:8080;
  proxy_pass $kindle_terminal_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Remote-User "";
  proxy_hide_header X-Powered-By;
}
location ^~ /kindle-terminal/ {
  set $kindle_terminal_upstream http://guacamole-kindle-terminal:8080;
  proxy_pass $kindle_terminal_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Remote-User "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_hide_header X-Powered-By;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
