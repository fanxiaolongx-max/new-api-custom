events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    absolute_redirect off;
    client_max_body_size 128m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $new_api_upstream http://new-api:3000;
    set $dozzle_upstream http://dozzle:8080;
    set $grok2api_upstream http://grok2api:8000;
    set $chat2api_upstream http://chat2api:5005;

    location = /grok2api {
      return 308 /grok2api/;
    }

    location = /grok {
      return 308 /grok2api/;
    }

    location ^~ /grok2api/v1/ {
      rewrite ^/grok2api/(.*) /$1 break;
      proxy_pass $grok2api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location ^~ /grok2api/api/ {
      rewrite ^/grok2api/(.*) /$1 break;
      proxy_pass $grok2api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location ^~ /grok2api/ {
      auth_request /_logs_auth;
      error_page 401 403 = @logs_sso;

      alias /usr/share/nginx/html/grok2api/;
      index index.html;
      try_files $uri $uri/ /index.html =404;
    }

    location = /chat2api {
      return 308 /chat2api/;
    }

    location = /gpt2api {
      return 308 /chat2api/;
    }

    location ^~ /chat2api/v1/ {
      rewrite ^/chat2api/(.*) /$1 break;
      proxy_pass $chat2api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location ^~ /chat2api/docs {
      rewrite ^/chat2api/(.*) /$1 break;
      proxy_pass $chat2api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      sub_filter 'href="/' 'href="/chat2api/';
      sub_filter 'src="/' 'src="/chat2api/';
      sub_filter_types *;
      sub_filter_once off;
    }

    location ^~ /chat2api/openapi.json {
      rewrite ^/chat2api/(.*) /$1 break;
      proxy_pass $chat2api_upstream;
      proxy_http_version 1.1;
    }

    location ^~ /chat2api/ {
      auth_request /_logs_auth;
      error_page 401 403 = @logs_sso;

      alias /usr/share/nginx/html/chat2api/;
      index index.html;
      try_files $uri $uri/ /index.html =404;
    }

    location = /logs {
      return 308 /logs/;
    }

    location = /logs/login {
      return 302 /logs/;
    }

    location = /_logs_auth {
      internal;
      proxy_pass $new_api_upstream/api/logs/auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
    }

    location @logs_sso {
      return 302 /api/user/auth/logs-sso?redirect=$request_uri;
    }

    location ^~ /logs/ {
      auth_request /_logs_auth;
      error_page 401 403 = @logs_sso;
      auth_request_set $logs_user $upstream_http_x_auth_user;

      proxy_pass $dozzle_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Remote-User $logs_user;
      proxy_set_header Remote-Name $logs_user;
      proxy_set_header Cookie "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      gzip off;
    }

    location / {
      proxy_pass $new_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
