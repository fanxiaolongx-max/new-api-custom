services:
  new-api:
    build:
      context: .
    image: new-api-custom:v1.0.0-rc.22-logs
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    expose:
      - "3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /sys/class/thermal:/sys/class/thermal:ro
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - SESSION_SECRET=4354598cbeb6e80141b2b8981a23b7f0ae37e818ae6e0d42aba4d04960049f3d
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=https://api2.fanxiaolong.uk
      - TZ=Asia/Shanghai
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=new-api

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - ./redis_data:/data

  chat2api:
    image: lanqian528/chat2api:latest
    container_name: chat2api
    restart: always
    labels:
      - dev.dozzle.logs=true
    ports:
      - "5005:5005"
    environment:
      - TZ=Asia/Shanghai
      - ENABLE_GATEWAY=True
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./chat2api_data:/app/data

  grok2api:
    image: ghcr.io/chenyme/grok2api:v3.1.2
    container_name: grok2api
    restart: unless-stopped
    labels:
      - dev.dozzle.logs=true
    init: true
    stop_grace_period: 30s
    ports:
      - "0.0.0.0:8000:8000"
    expose:
      - "8000"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./grok2api/config.yaml:/run/grok2api/config.yaml:ro
      - ./grok2api/data:/app/data
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  dozzle:
    image: amir20/dozzle:v10.6.14
    container_name: dozzle
    restart: always
    expose:
      - "8080"
    environment:
      - DOZZLE_BASE=/logs
      - DOZZLE_AUTH_PROVIDER=forward-proxy
      - DOZZLE_AUTH_TTL=12h
      - DOZZLE_FILTER=label=dev.dozzle.logs=true
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle_data:/data

  gateway:
    image: nginx:1.29-alpine
    container_name: new-api-gateway
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/chat2api-dashboard:/usr/share/nginx/html/chat2api:ro
      - ./gateway/grok2api-dashboard:/usr/share/nginx/html/grok2api:ro
    depends_on:
      - new-api
      - dozzle
